  <a class="card" href="web/gesture-lab.html">
    <b>鏡頭檢查與手勢測試</b>
    <span>確認鏡頭看得到手、五個施法動作判定是否正常。也可以切成觸控模式。</span>
  </a>

  <div class="note">
    <b>用平板怎麼測</b>
    <ol>
      <li>把平板立在桌上，鏡頭稍微往上仰，人坐在大約 70～90 公分外。</li>
      <li>開上面那一頁，允許使用相機。</li>
      <li>先按「校正：自然垂放」，雙手自然放在身前約一秒。</li>
      <li>再按「校正：盡力舉高」，雙手盡量舉高、但要留在畫面裡。</li>
      <li>然後試著做各個動作，看對應的符文會不會亮起來。</li>
    </ol>
    影像只在裝置本機運算，不會上傳，也不會儲存。
  </div>
